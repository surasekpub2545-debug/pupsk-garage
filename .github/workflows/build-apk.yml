name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # allow manual run from GitHub UI

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libncurses5 libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install buildozer & cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Cache buildozer local
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Build debug APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          buildozer -v android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: List output
        if: always()
        run: ls -la bin/ || echo "(no bin/ — build failed)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pupsk-garage-apk
          path: bin/*.apk
          retention-days: 30

      - name: Upload buildozer log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            .buildozer/android/platform/build-*/dists/**/build.log
            .buildozer/**/*.log
          retention-days: 7
          if-no-files-found: ignore
